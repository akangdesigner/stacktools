name: Silver Reminder Push

# 銀髮固定提醒排程：每 15 分鐘打一次 push-due，讓長輩自選的整點提醒準時送出。
# 取代原本 n8n「銀髮-排程-固定提醒」單一每天 8:30 的做法（沒有時間可選）。
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder push
        run: |
          curl -sf -X POST "https://tool.dg166.com/api/silver/recurring-reminders/push-due" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
